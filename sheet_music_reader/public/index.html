<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sweden MIDI Generator</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Photo transcription</p>
        <h1 id="title">Sweden MIDI Generator</h1>
        <p class="status" id="status">Ready to generate the piano MIDI from the encoded first-page transcription.</p>
        <div class="actions">
          <button id="downloadButton" type="button">Download MIDI</button>
          <button id="playButton" type="button">Play Preview</button>
        </div>
        <dl class="facts">
          <div>
            <dt>Tempo</dt>
            <dd>46 BPM</dd>
          </div>
          <div>
            <dt>Key</dt>
            <dd>D major</dd>
          </div>
          <div>
            <dt>Length</dt>
            <dd>16 measures</dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
