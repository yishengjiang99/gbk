name: GBKComposer
options:
  bundleIdPrefix: com.grepawk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: 83D36RPMUM
    CURRENT_PROJECT_VERSION: "1"
packages:
  SF2Player:
    url: https://github.com/yishengjiang99/sf2player-swift.git
    revision: 6ce4941247d1dcd178da5c71b9279a9cf91fc007
# TODO: playback is not built on SF2Engine yet. Copy the sequencer and MIDI parsing from
#       earsheet's Packages/SF2Player when wiring SF2 playback.
targets:
  GBKComposer:
    type: application
    platform: iOS
    sources:
      - path: GBKComposer
    dependencies:
      - package: SF2Player
        product: SF2Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grepawk.moviefone
        INFOPLIST_FILE: GBKComposer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GBKComposer/Resources/GBKComposer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  GBKComposerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GBKComposerTests
    dependencies:
      - target: GBKComposer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GBKComposer.app/GBKComposer
schemes:
  GBKComposer:
    build:
      targets:
        GBKComposer: all
        GBKComposerTests: [test]
    test:
      targets:
        - GBKComposerTests
