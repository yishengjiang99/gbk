name: GBKComposer
options:
  bundleIdPrefix: com.grepawk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
# packages:
#   SF2Player:
#     url: https://github.com/yishengjiang99/sf2player-swift
#     revision: <SHA TBD>   # pin when the SHA is provided
targets:
  GBKComposer:
    type: application
    platform: iOS
    sources:
      - path: GBKComposer
    # dependencies:
    #   - package: SF2Player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grepawk.gbkcomposer
        INFOPLIST_FILE: GBKComposer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GBKComposer/Resources/GBKComposer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  GBKComposerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GBKComposerTests
    dependencies:
      - target: GBKComposer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GBKComposer.app/GBKComposer
schemes:
  GBKComposer:
    build:
      targets:
        GBKComposer: all
        GBKComposerTests: [test]
    test:
      targets:
        - GBKComposerTests
