name: GBKComposer
options:
  bundleIdPrefix: com.grepawk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: 83D36RPMUM
    CURRENT_PROJECT_VERSION: "1"
    # Google sign-in (iOS OAuth client). Placeholder until Yisheng creates the iOS client in Google Cloud Console:
    # set both, e.g. 1234-abc.apps.googleusercontent.com / com.googleusercontent.apps.1234-abc, and add the client ID
    # to the server's GOOGLE_IOS_CLIENT_IDS. Empty client ID = the app shows "not available yet".
    GOOGLE_IOS_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.placeholder
packages:
  SF2Player:
    url: https://github.com/yishengjiang99/sf2player-swift.git
    revision: 6ce4941247d1dcd178da5c71b9279a9cf91fc007
  HearSheetCore:
    path: Packages/HearSheetCore
  # Sheet-music recognition (AGPL-3.0, port of liebharc/homr). Vendored copy of omr-sheet-cam's
  # Packages/omr-homr-ios (see Packages/omr-homr-ios/VENDORED.md for the pinned SHA and update steps).
  OMRHomrIOS:
    path: Packages/omr-homr-ios
# TODO: playback is not built on SF2Engine yet. Copy the sequencer and MIDI parsing from
#       earsheet's Packages/SF2Player when wiring SF2 playback.
targets:
  GBKComposer:
    type: application
    platform: iOS
    sources:
      - path: GBKComposer
      # UI-test Hum harness + fixture. Loose files under the GBKComposer path are NOT auto-bundled
      # (same reason HumModel needs its own entry below): without this, hum-harness.html and
      # hum-fixture.wav never reach the app bundle, Bundle.main.url(forResource:) returns nil, the
      # -uiTestHum launch falls back to the live studio page and HumUITests times out waiting for the
      # harness. buildPhase: resources (no folder type) lands both files flat at the bundle root,
      # matching the flat lookups in StudioWebView/HumBridge.
      - path: GBKComposer/Resources/HumTest
        buildPhase: resources
      # Basic Pitch Core ML model for native Hum (committed, 288 KB; refresh with scripts/fetch-hum-model.sh).
      - path: HumModel
        type: folder
        optional: true
    dependencies:
      - package: SF2Player
        product: SF2Engine
      - package: HearSheetCore
      - package: OMRHomrIOS
        product: OMRHomrIOS
    postCompileScripts:
      - name: Bundle OMR models
        basedOnDependencyAnalysis: false
        script: |
          # homr ONNX models (models.lock; fetched by scripts/fetch-models into gitignored ios/models/) -> <App>.app/models/.
          # Missing models: warning, nothing bundled; the app then reports "recognition models are not installed".
          # OMR_REQUIRE_MODELS=1 (release archive) fails instead.
          set -eu
          SRC="${SRCROOT}/models"; DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/models"
          names=$(grep -Ev '^[[:space:]]*(#|$)' "${SRCROOT}/models.lock" | awk '{print $2}')
          missing=""; for n in $names; do [ -f "$SRC/$n" ] || missing="$missing $n"; done
          if [ -n "$missing" ]; then
            if [ "${OMR_REQUIRE_MODELS:-0}" = "1" ]; then echo "error: OMR models missing:$missing (run ios/scripts/fetch-models)" >&2; exit 1; fi
            echo "warning: OMR models not bundled (missing:$missing); run ios/scripts/fetch-models"; exit 0
          fi
          mkdir -p "$DST"; for n in $names; do cmp -s "$SRC/$n" "$DST/$n" || cp -p "$SRC/$n" "$DST/$n"; done
          echo "Bundled OMR models: $(du -sh "$DST" | cut -f1)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grepawk.moviefone
        INFOPLIST_FILE: GBKComposer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GBKComposer/Resources/GBKComposer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  GBKComposerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GBKComposerTests
        excludes: ["Fixtures/**"]
      - path: GBKComposerTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: GBKComposer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GBKComposer.app/GBKComposer
  GBKComposerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GBKComposerUITests
    dependencies:
      - target: GBKComposer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GBKComposer
schemes:
  GBKComposer:
    build:
      targets:
        GBKComposer: all
        GBKComposerTests: [test]
        GBKComposerUITests: [test]
    run:
      storeKitConfiguration: StoreKit/GBKComposer.storekit
    test:
      targets:
        - GBKComposerTests
        - GBKComposerUITests
