<!doctype html>
<!-- UI-test harness for the native Hum bridge (HumBridge.swift): implements the web side of the contract
     exactly as GBK Social should, against a minimal project (480 ppq, 120 bpm, one track on channel 0). -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px -apple-system;margin:0;padding:16px}#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px;border-top:1px solid #ccc;background:#fff}
#bar input{flex:1;font-size:16px}#out div{margin:4px 0}</style></head>
<body><h3>Hum harness</h3><div id="caps"></div><div id="state">phase: idle</div><div id="out"></div>
<div id="bar"><input placeholder="Describe the music to compose…" aria-label="composer input"><button id="hum" data-testid="hum-btn">🎤 Hum</button><button>Send</button></div>
<script>
const project = { ppq: 480, tempos: [{ tick: 0, microPerQuarter: 500000 }], tracks: [{ id: "t0", channel: 0 }], readOnlyReason: null };
const caps = window.gbkNative && window.gbkNative.capabilities || [];
document.getElementById('caps').textContent = 'native: ' + caps.join(',');
document.getElementById('hum').style.display = caps.includes('hum') ? '' : 'none';
document.getElementById('hum').onclick = () => webkit.messageHandlers.hum.postMessage({ type: 'toggle' });
window.gbkHum = {
  context: () => ({ ppq: project.ppq, tempos: project.tempos, tracks: project.tracks.map(t => ({ channel: t.channel })), readOnlyReason: project.readOnlyReason }),
  apply: (ops, opts) => {
    const add = ops.find(o => o.op === 'addTrack'), notes = ops.find(o => o.op === 'addNotes');
    if (!add || !notes) return { ok: false, error: 'bad ops' };
    project.tracks.push({ id: add.id, channel: add.channel });
    const line = document.createElement('div');
    line.textContent = `${add.name}: ${notes.notes.length} notes, channel ${add.channel}, pitches ${notes.notes.map(n => n.pitch).join(' ')}`;
    line.setAttribute('data-testid', 'hum-result');
    document.getElementById('out').appendChild(line);
    return { ok: true };
  },
  showReadOnlyHint: (r) => { document.getElementById('out').textContent = 'read-only: ' + r; },
  onState: (s) => {
    document.getElementById('state').textContent = 'phase: ' + s.phase;
    document.getElementById('hum').textContent = s.phase === 'recording' ? '⏺ Stop' : s.phase === 'transcribing' ? '🎤 ' + Math.round(s.progress * 100) + '%' : '🎤 Hum';
  },
};
</script></body></html>
