name: ASC Listing (metadata + screenshots)

# Manual only. Modes push/verify apply or read back the docs/asc listing (copy +
# screenshots) via docs/asc/scripts/push_listing.py; attach-build attaches a
# TestFlight build to v1.0; precheck runs read-only submission gates; submit
# submits v1.0 for App Store review via docs/asc/scripts/submit_review.py.
# Only the submit mode submits anything. App Privacy is not touched (Apple
# exposes no API for it).
# Secrets mirror ios-release.yml: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_API_KEY_P8. push_listing.py reads ASC_ISSUER_ID / ASC_KEY_ID / ASC_KEY_PATH.
# Optional secrets, passed through only if set: REVIEW_CONTACT_FIRST, REVIEW_CONTACT_LAST,
# REVIEW_CONTACT_PHONE, REVIEW_CONTACT_EMAIL, REVIEW_DEMO_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "push = apply listing, then read back; verify = read back only; attach-build = attach a TestFlight build to v1.0 (never submits); precheck = read-only submission gates; submit = SUBMIT v1.0 for App Store review"
        type: choice
        options: [push, verify, attach-build, precheck, probe, submit]
        default: push
      build_number:
        description: "TestFlight build number for attach-build, and the build the submit mode requires to be attached"
        type: string
        default: "29"

concurrency:
  group: asc-listing
  cancel-in-progress: false

jobs:
  listing:
    name: Apply listing to ASC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
      REVIEW_CONTACT_FIRST: ${{ secrets.REVIEW_CONTACT_FIRST }}
      REVIEW_CONTACT_LAST: ${{ secrets.REVIEW_CONTACT_LAST }}
      REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
      REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
      REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "pyjwt[crypto]" requests

      - name: Write ASC API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${ASC_ISSUER_ID:-}"
          test -n "${ASC_KEY_ID:-}"
          test -n "${P8:-}"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Push listing (never submits)
        if: inputs.mode == 'push'
        run: python3 docs/asc/scripts/push_listing.py

      - name: Verify listing (read back only)
        if: inputs.mode == 'verify'
        run: python3 docs/asc/scripts/push_listing.py --verify

      - name: Attach build to version 1.0 (never submits)
        if: inputs.mode == 'attach-build'
        env:
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 docs/asc/scripts/attach_build.py

      - name: Pre-submit checks (read-only)
        if: inputs.mode == 'precheck'
        run: python3 docs/asc/scripts/precheck_submit.py

      - name: Probe submission blockers (read-only)
        if: inputs.mode == 'probe'
        env:
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 docs/asc/scripts/probe_submit_error.py

      - name: Submit version 1.0 for App Store review
        if: inputs.mode == 'submit'
        env:
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 docs/asc/scripts/submit_review.py
