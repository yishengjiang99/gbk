name: iOS Release (TestFlight)

# Manual only. Unsigned archive, then cloud-managed distribution signing at export via the ASC admin API key; no p12 or profile secrets.
# Secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8.
# Bundle com.grepawk.moviefone matches ASC app 6826906431 (GBK Music Composer). Build number = run_number.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What to Test notes (optional)
        required: false
        default: CI build
      marketing_version:
        description: CFBundleShortVersionString
        required: true
        default: '0.1.0'

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
      ARCHIVE_PATH: ${{ github.workspace }}/build/GBKComposer.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      TEAM_ID: 83D36RPMUM
      BUNDLE_ID: com.grepawk.moviefone

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write ASC API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test -n "${P8:-}"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Write ExportOptions.plist
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$GITHUB_WORKSPACE/ExportOptions.plist"
          plutil -lint "$GITHUB_WORKSPACE/ExportOptions.plist"

      - name: Fetch OMR models (homr ONNX, SHA-pinned in ios/models.lock)
        working-directory: ios
        run: scripts/fetch-models

      - name: Archive
        working-directory: ios
        env:
          MV: ${{ github.event.inputs.marketing_version }}
          OMR_REQUIRE_MODELS: "1"
        run: |
          set -euo pipefail
          [[ "$MV" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::invalid marketing_version '$MV'"; exit 1; }
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild \
            -project GBKComposer.xcodeproj \
            -scheme GBKComposer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$MV" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test -d "$ARCHIVE_PATH"

      - name: Fix embedded framework MinimumOSVersion
        # The onnxruntime SPM wrapper framework is built at the app's deployment target but ships the
        # ORT pod Info.plist (MinimumOSVersion 15.1); App Store processing rejects the mismatch (ITMS-90208).
        # Set each embedded framework's MinimumOSVersion to its binary's LC_BUILD_VERSION minos; export re-signs.
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          for fw in "$APP"/Frameworks/*.framework; do
            [[ -d "$fw" ]] || continue
            plist="$fw/Info.plist"
            bin="$fw/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
            minos=$(xcrun vtool -show-build "$bin" | awk '/minos/{print $2; exit}')
            cur=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || echo none)
            echo "$(basename "$fw"): plist=$cur binary=$minos"
            [[ -n "$minos" && "$cur" != "$minos" ]] || continue
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $minos" "$plist"
          done

      - name: Ad-hoc sign archive with entitlements
        # The archive is built unsigned: automatic signing on an ephemeral runner mints a new
        # Apple Development certificate every run and the team hits Apple's certificate cap.
        # Export re-signs with the cloud-managed distribution certificate (no cap); it reads
        # entitlements from the archived binary, so embed them here with an ad-hoc signature.
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          ENT="$RUNNER_TEMP/app.entitlements"
          cp ios/GBKComposer/Resources/GBKComposer.entitlements "$ENT"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string ${TEAM_ID}.${BUNDLE_ID}" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :get-task-allow bool false" "$ENT"
          for fw in "$APP"/Frameworks/*; do
            [[ -e "$fw" ]] || continue
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$(find "$EXPORT_PATH" -name '*.ipa' | head -1)"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          if grep -Eiq 'UPLOAD FAILED|Validation failed|STATE_ERROR\.VALIDATION_ERROR|Failed to upload package|ERROR:\s*\[altool' "$RUNNER_TEMP/altool-upload.log"; then
            echo "::error::altool upload/validation failed"; exit 1
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading|Delivery UUID|The package was successfully uploaded' "$RUNNER_TEMP/altool-upload.log" || { echo "::error::altool did not report success"; exit 1; }

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight upload"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Version: ${{ github.event.inputs.marketing_version }} (${{ github.run_number }})"
            echo "- Notes: ${{ github.event.inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
