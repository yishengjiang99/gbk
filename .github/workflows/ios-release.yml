name: iOS Release (TestFlight)

# Manual only. Mirrors yishengjiang99/finalcut ios-testflight.yml and uses the same secret names:
# APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8,
# IOS_DISTRIBUTION_P12_BASE64, IOS_DISTRIBUTION_P12_PASSWORD, IOS_APPSTORE_PROFILE_BASE64.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What to Test notes (optional)
        required: false
        default: CI build
      marketing_version:
        description: CFBundleShortVersionString
        required: true
        default: '0.1.0'
      profile_name:
        description: App Store provisioning profile name
        required: true
        default: 'GBK Composer App Store'

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
      ARCHIVE_PATH: ${{ github.workspace }}/build/GBKComposer.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      TEAM_ID: 83D36RPMUM
      BUNDLE_ID: com.grepawk.gbkcomposer
      PROFILE_NAME: ${{ github.event.inputs.profile_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write ASC API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test -n "${P8:-}"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Install Distribution cert + App Store profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${P12_BASE64:-}" && test -n "${P12_PASSWORD:-}" && test -n "${PROFILE_BASE64:-}"
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PROFILE_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID=$UUID"

      - name: Write ExportOptions.plist
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$GITHUB_WORKSPACE/ExportOptions.plist"
          plutil -lint "$GITHUB_WORKSPACE/ExportOptions.plist"

      - name: Archive
        working-directory: ios
        env:
          MV: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          [[ "$MV" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::invalid marketing_version '$MV'"; exit 1; }
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild \
            -project GBKComposer.xcodeproj \
            -scheme GBKComposer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$MV" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          test -d "$ARCHIVE_PATH"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$(find "$EXPORT_PATH" -name '*.ipa' | head -1)"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          if grep -Eiq 'UPLOAD FAILED|Validation failed|STATE_ERROR\.VALIDATION_ERROR|Failed to upload package|ERROR:\s*\[altool' "$RUNNER_TEMP/altool-upload.log"; then
            echo "::error::altool upload/validation failed"; exit 1
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading|Delivery UUID|The package was successfully uploaded' "$RUNNER_TEMP/altool-upload.log" || { echo "::error::altool did not report success"; exit 1; }

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight upload"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Version: ${{ github.event.inputs.marketing_version }} (${{ github.run_number }})"
            echo "- Notes: ${{ github.event.inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
