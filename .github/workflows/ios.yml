name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", ".github/workflows/ios-release.yml", "src/native/**"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml", ".github/workflows/ios-release.yml", "src/native/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # main runs always finish (busy main kept cancelling every run)

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60 # build ~7 + test ~21 + iPad screenshot ~13 + uploads/post ~8 min
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache OMR models
        uses: actions/cache@v4
        with:
          path: ios/models
          key: omr-models-${{ hashFiles('ios/models.lock') }}
      - name: Fetch OMR models (homr ONNX, SHA-pinned in ios/models.lock)
        run: scripts/fetch-models
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Use the software keyboard in the simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
      - name: Build
        run: |
          xcodebuild build -project GBKComposer.xcodeproj -scheme GBKComposer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: .*GBKComposer|BUILD" || true
          test ${PIPESTATUS[0]} -eq 0
      - name: Test
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/ios/snapshots
          TEST_RUNNER_OMR_REQUIRE_MODELS: "1"
        run: |
          xcodebuild test -project GBKComposer.xcodeproj -scheme GBKComposer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: iPad feed screenshot
        if: always()
        continue-on-error: true
        timeout-minutes: 15 # best-effort: a slow second simulator must not eat the job's time budget
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/GBKComposer.app' -maxdepth 6 | head -1)
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for k in sorted(d, reverse=True):
              for dev in d[k]:
                  if "iOS" in k and dev["name"].startswith("iPad Pro 13"): print(dev["udid"]); sys.exit()
          for k in sorted(d, reverse=True):
              for dev in d[k]:
                  if "iOS" in k and dev["name"].startswith("iPad"): print(dev["udid"]); sys.exit()
          ')
          echo "app=$APP ipad=$IPAD"
          mkdir -p snapshots
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl install "$IPAD" "$APP"
          xcrun simctl launch --console-pty "$IPAD" com.grepawk.moviefone > ipad-console.log 2>&1 &
          sleep 30
          xcrun simctl io "$IPAD" screenshot snapshots/feed-ipad-portrait.png
          echo "--- console"; tail -60 ipad-console.log || true
          echo "--- running?"; xcrun simctl spawn "$IPAD" launchctl list | grep -i moviefone || echo "not running"
          echo "--- crashes"; ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E "GBK|moviefone" | head -3 | while read f; do head -80 ~/Library/Logs/DiagnosticReports/"$f"; done
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          path: ios/snapshots/*.png
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
