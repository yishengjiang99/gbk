name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 15
      - name: server tests (diagnostic, per file)
        timeout-minutes: 20
        run: |
          for f in server/test/*.test.ts; do echo "=== $f"; timeout 150 node --disable-warning=ExperimentalWarning --import tsx/esm --import ./test/support/offline-audio-context.ts --test "$f" 2>&1 | grep -E '^# (pass|fail)|^not ok' ; echo "rc=${PIPESTATUS[0]}"; done
