name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y moreutils >/dev/null
      - name: server tests (diagnostic, mcp-workflow)
        timeout-minutes: 12
        run: timeout 600 node --disable-warning=ExperimentalWarning --import tsx/esm --import ./test/support/offline-audio-context.ts --test --test-reporter=spec server/test/mcp-workflow.test.ts 2>&1 | ts '%H:%M:%S' || true
        shell: bash
