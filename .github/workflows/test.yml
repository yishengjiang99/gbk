name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 15
      - run: npm run build:server   # server/dist/widget assets served by /api/mcp/widget
      - run: npm run test:server
        timeout-minutes: 15
      - run: npm run test:mcp   # MCP subset again on its own line so a protocol regression is easy to spot in the log
        timeout-minutes: 10

  # Launch checks (#72 Phase 8): no network, no paid calls, no prod secrets.
  launch-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:server            # render worker + widget assets must exist for the deploy package
      - run: node scripts/launch/check-launch.mjs --self-test
      - run: npm run check:launch            # manifest validity, deploy package contents, token-leak scan
      - run: node --disable-warning=ExperimentalWarning --import tsx/esm --import ./test/support/offline-audio-context.ts --test server/test/launch-*.test.ts server/test/mcp-listing.test.ts server/test/gallery.test.ts server/test/deploy-nginx.test.ts server/test/funnel*.test.ts

  # Composer browser e2e (real server + fake model + Chromium). Report-only for now: 3 Studio specs
  # (share-link open, theme/landing) already fail on main as of 2026-10-24; make this required once they pass.
  e2e-composer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:composer -- --project=chrome-no-webmcp --project=mobile
        env:
          PW_CHROME_CHANNEL: chromium
          GBK_SHOTS: ${{ runner.temp }}/shots
