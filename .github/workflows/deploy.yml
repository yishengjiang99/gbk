# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache OMR models
        uses: actions/cache@v4
        with:
          path: omr-homr-web/models
          key: omr-models-homr-308-465-v1
      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves the repo under /gbk/ (compose.grepawk.com builds with GBK_BASE_PATH=/).
          GBK_BASE_PATH: /gbk/
          # Optional WebMCP origin-trial token for https://yishengjiang99.github.io (see docs/webmcp.md). Empty = no meta tag.
          GBK_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.GBK_WEBMCP_ORIGIN_TRIAL_TOKEN || secrets.GBK_WEBMCP_ORIGIN_TRIAL_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

