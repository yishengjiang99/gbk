# Optional self-contained stack (TLS terminated in front of `web`, e.g. by the host nginx/certbot).
services:
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile.agent }
    env_file: /etc/gbk-composer.env
    volumes: [composer-data:/data]
    restart: unless-stopped
    expose: ["8080"]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend }
    depends_on: [agent]
    ports: ["127.0.0.1:8793:80"]
    restart: unless-stopped
  # Live Jam relay (docs/live-jam/deployment.md). Start with: docker compose --profile turn up -d turn
  # Host networking: TURN needs its real ports and IP and must not sit behind nginx.
  turn:
    image: coturn/coturn:4.6.3
    profiles: [turn]
    network_mode: host
    env_file: /etc/gbk-turn.env
    volumes: ["./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro", "/etc/gbk-turn-certs:/etc/coturn/certs:ro"]
    entrypoint: ["sh", "-c", 'exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SHARED_SECRET" --external-ip="$$TURN_EXTERNAL_IP" --realm="$$TURN_REALM"']
    restart: unless-stopped
volumes:
  composer-data: {}
