# compose.grepawk.com - GBK Composer (static SPA + same-origin agent API / WebSocket).
# Installed by deploy/remote-install.sh as /etc/nginx/sites-available/compose.grepawk.com (+ sites-enabled symlink).
# TLS: the Certbot-managed 443 lines and the port-80 redirect live in this file (cert paths only, no secrets), so
# installing it never drops HTTPS. Install only via deploy/install-nginx.sh (backup, nginx -t, HTTPS probe, rollback).
# The agent API listens on 127.0.0.1:8792 only, so it is reachable solely through this proxy.
# Zero-downtime deploys: remote-install.sh starts a standby instance of the new release on :8793, health-checks it,
# then restarts the primary (:8792). While the primary is down, connect errors fail over to the standby; the
# standby only runs during a deploy (idle otherwise, so all traffic and in-memory sessions live on the primary).
upstream gbk_composer {
    server 127.0.0.1:8792 max_fails=0;  # never mark down: each request tries the primary first
    server 127.0.0.1:8793 max_fails=0 backup;
}
map $http_upgrade $gbk_composer_connection { default upgrade; '' close; }

server {
    server_name compose.grepawk.com;

    root /var/www/gbk-composer/current/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 48m;   # shared WAV uploads (the API enforces its own per-kind limits)

    location = /api/agent/ws {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gbk_composer_connection;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /api/ {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    # Remote MCP (ChatGPT / Codex): Streamable HTTP + SSE. Streaming responses must not be buffered,
    # renders can be requested with waitSeconds up to 120s, and MCP artifact downloads stream with
    # Range support (the generic /api/ block above already covers /api/mcp/*).
    location = /mcp {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        client_max_body_size 1m;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # OAuth 2.1 discovery + endpoints (authorization server lives on the same origin as the resource).
    location ^~ /.well-known/ {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /oauth/ {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
    # Fingerprinted Vite chunks: cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip on; gzip_vary on; gzip_types application/javascript text/css application/wasm;
    }
    # Content-hashed SoundFonts (static/sf/<name>.<sha12>.sf2): immutable for a year, precompressed .gz served via
    # brotli_static (.br, ~19% smaller; module built by deploy/install-brotli.sh) with gzip_static fallback (Vary: Accept-Encoding).
    location ^~ /static/sf/ {
        try_files $uri =404;
        types { } default_type application/octet-stream;
        brotli_static on; gzip_static on; gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # SoundFont / MIDI / OMR models / ORT runtime: not fingerprinted, a day.
    # ONNX Runtime web files (Hum / Scan): module scripts must be served as JavaScript and wasm as application/wasm,
    # or nosniff makes browsers refuse them (Ubuntu's mime.types has no .mjs). No COOP/COEP: they would break the
    # ChatGPT widget embed and cross-origin images/audio; ORT runs single-threaded without crossOriginIsolated.
    location ^~ /ort-runtime/ {
        try_files $uri =404;
        types { text/javascript mjs js; application/wasm wasm; application/json json; }
        default_type application/octet-stream;
        gzip on; gzip_vary on; gzip_types text/javascript application/wasm;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(static|omr-models|ort-runtime)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Launch video + poster: kept outside releases (not in git), uploaded once to /var/www/gbk-composer/media.
    location ^~ /media/ {
        alias /var/www/gbk-composer/media/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Large SoundFonts (FluidR3 GM): kept outside releases like /media/, synced
    # once by deploy/deploy.sh to /var/www/gbk-composer/soundfonts/ (pinned in
    # soundfonts/catalog.json). Small fonts ship in dist/static instead.
    location ^~ /soundfonts/ {
        alias /var/www/gbk-composer/soundfonts/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(sheet-cam|midi-clock)\.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    # Server-rendered static pages (crawlable): ChatGPT landing, privacy, terms, support, robots, sitemap.
    location ~ ^/(chatgpt(/install|/gallery(/[a-z0-9-]+/song\.(wav|mid))?)?|privacy|terms|support|robots\.txt|sitemap(-pages|-songs-[0-9]+)?\.xml|signin/reviewer)$ {
        proxy_pass http://gbk_composer;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Song and profile pages: SPA shell with server-injected title/description/canonical/og tags.
    # Falls back to the static shell if the app is down.
    location ~ ^/((s|u)/[^/]+|og/s/[A-Za-z0-9-]+\.png)$ {
        proxy_pass http://gbk_composer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @spa { try_files /index.html =404; add_header Cache-Control "no-cache" always; }
    # SPA routes (/, /studio, /s/<slug>, /explore): index.html, never aggressively cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        gzip on; gzip_vary on; gzip_types application/json;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/compose.grepawk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/compose.grepawk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = compose.grepawk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name compose.grepawk.com;
    return 404; # managed by Certbot
}
