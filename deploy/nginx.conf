# compose.grepawk.com - GBK Composer (static SPA + same-origin agent API / WebSocket).
# Installed by deploy/remote-install.sh as /etc/nginx/sites-available/compose.grepawk.com (+ sites-enabled symlink).
# TLS: `certbot --nginx -d compose.grepawk.com` adds the 443 block + redirect (same convention as music.grepawk.com).
# The agent API listens on 127.0.0.1:8792 only, so it is reachable solely through this proxy.
map $http_upgrade $gbk_composer_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name compose.grepawk.com;

    root /var/www/gbk-composer/current/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 48m;   # shared WAV uploads (the API enforces its own per-kind limits)

    location = /api/agent/ws {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gbk_composer_connection;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    # Fingerprinted Vite chunks: cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip on; gzip_vary on; gzip_types application/javascript text/css application/wasm;
    }
    # SoundFont / MIDI / OMR models / ORT runtime: not fingerprinted, a day.
    location ~ ^/(static|omr-models|ort-runtime)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Launch video + poster: kept outside releases (not in git), uploaded once to /var/www/gbk-composer/media.
    location ^~ /media/ {
        alias /var/www/gbk-composer/media/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Large SoundFonts (FluidR3 GM): kept outside releases like /media/, synced
    # once by deploy/deploy.sh to /var/www/gbk-composer/soundfonts/ (pinned in
    # soundfonts/catalog.json). Small fonts ship in dist/static instead.
    location ^~ /soundfonts/ {
        alias /var/www/gbk-composer/soundfonts/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(sheet-cam|midi-clock)\.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    # SPA routes (/, /studio, /s/<slug>, /explore): index.html, never aggressively cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        gzip on; gzip_vary on; gzip_types application/json;
    }
}
