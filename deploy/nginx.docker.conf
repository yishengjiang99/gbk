# compose.grepawk.com - GBK Composer (static SPA + same-origin agent API / WebSocket).
map $http_upgrade $gbk_composer_connection { default upgrade; "" close; }
# Installed by deploy/remote-install.sh as /etc/nginx/sites-available/compose.grepawk.com (+ sites-enabled symlink).
# TLS: `certbot --nginx -d compose.grepawk.com` adds the 443 block + redirect (same convention as music.grepawk.com).
# The agent API listens on agent:8080 only, so it is reachable solely through this proxy.


server {
    listen 80;
    listen [::]:80;
    server_name compose.grepawk.com;

    root /var/www/gbk-composer/current/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 48m;   # shared WAV uploads (the API enforces its own per-kind limits)

    # Live Jam signaling. No proxy_next_upstream: a jam socket must not silently move to the standby
    # (clients reconnect with a fresh ticket and see the new serverEpoch instead).
    location = /api/jam/ws {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gbk_composer_connection;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /api/agent/ws {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gbk_composer_connection;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /api/ {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    # Fingerprinted Vite chunks: cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip on; gzip_vary on; gzip_types application/javascript text/css application/wasm;
    }
    # SoundFont / MIDI / OMR models / ORT runtime: not fingerprinted, a day.
    # ONNX Runtime web files (Hum / Scan): module scripts must be served as JavaScript and wasm as application/wasm,
    # or nosniff makes browsers refuse them (Ubuntu's mime.types has no .mjs). No COOP/COEP: they would break the
    # ChatGPT widget embed and cross-origin images/audio; ORT runs single-threaded without crossOriginIsolated.
    location ^~ /ort-runtime/ {
        try_files $uri =404;
        types { text/javascript mjs js; application/wasm wasm; application/json json; }
        default_type application/octet-stream;
        gzip on; gzip_vary on; gzip_types text/javascript application/wasm;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(static|omr-models|ort-runtime)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(sheet-cam|midi-clock)\.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    # SPA routes (/, /studio, /s/<slug>, /explore): index.html, never aggressively cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        gzip on; gzip_vary on; gzip_types text/html application/json;
    }
}
